name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test API and build frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: juniper
          POSTGRES_PASSWORD: juniper_test_pw
          POSTGRES_DB: juniper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://juniper:juniper_test_pw@localhost:5432/juniper_test
      DATABASE_SSL: 'false'
      SESSION_SECRET: ci-session-secret-not-used-in-production
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Build frontend
        run: npm run build

      - name: Run migrations
        run: npm run migrate

      - name: Seed the menu
        run: npm run seed

      - name: Start API
        run: npm run api:start &
        env:
          PORT: '4000'

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time" >&2
          exit 1

      - name: Run smoke tests
        run: node server/scripts/smoke-test.js http://localhost:4000
